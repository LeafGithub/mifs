# Weekly: looks for official ModLoader releases that have no bundle yet and starts "Build ModLoader bundle" for them.
# Forks are never built automatically; publish those by running "Build ModLoader bundle" by hand.
name: Check upstream for new releases

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC (off the hour: GitHub delays top-of-hour runs under load)
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would be built
        type: boolean
        default: false

permissions:
  contents: read
  actions: write # needed to start the bundle build

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests for the checker
        run: node --test bundle/scripts/check-upstream.test.mjs

      - name: Find official releases without a bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: node bundle/scripts/check-upstream.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
