# Windows packaging. electron-vite bundles everything into out/, so no node_modules ship.
appId: dev.mifs.app
productName: ModLoader Installer for SugarCube
executableName: MIFS
copyright: MIT-licensed tooling; see licenses in the app folder
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
electronVersion: 44.7.0 # pinned: electron-builder needs an exact version
publish:
  # Read by electron-updater at runtime (written to app-update.yml); CI uploads the files, builds never publish.
  provider: github
  owner: LeafGithub
  repo: mifs
asar: true
npmRebuild: false
compression: normal
extraResources:
  # build-from-source runs this script (with modlist.mjs and mods.json beside it) on the user's Node.js
  - from: ../../bundle/scripts/build-bundle.mjs
    to: bundle/scripts/build-bundle.mjs
  - from: ../../bundle/scripts/modlist.mjs
    to: bundle/scripts/modlist.mjs
  - from: ../../bundle/mods.json
    to: bundle/mods.json
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: x64
    - target: portable
      arch: x64
  artifactName: MIFS-${version}-${arch}.${ext}
nsis:
  shortcutName: ModLoader Installer for SugarCube
  oneClick: false
  perMachine: false # installs for the current user, no admin prompt
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false # keeps downloaded games and installed bundles
  artifactName: MIFS-Setup-${version}.${ext}
portable:
  artifactName: MIFS-${version}-portable.${ext}
