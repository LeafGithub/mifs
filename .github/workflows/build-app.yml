# Builds the MIFS installers (setup + portable) on a Windows runner. A version tag (v*) also publishes them as a release.
# Typecheck and unit tests gate the build; the Playwright e2e suite is not run here.
name: Build app
run-name: Build app ${{ github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create releases

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./packages/desktop/package.json').version")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match packages/desktop/package.json version $version" >&2
            exit 1
          fi

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        shell: bash
        run: |
          npm test
          npm test -w @mifs/desktop
          node --test bundle/scripts/check-upstream.test.mjs bundle/scripts/ci-failure-issue.test.mjs bundle/scripts/modlist.test.mjs

      - name: Build installers
        run: npm run dist -w @mifs/desktop -- --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            packages/desktop/release/MIFS-Setup-*.exe
            packages/desktop/release/MIFS-*-portable.exe
            packages/desktop/release/MIFS-Setup-*.exe.blockmap
            packages/desktop/release/latest.yml
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          # latest.yml and the blockmap are what the installed app's updater reads
          files=(packages/desktop/release/MIFS-Setup-*.exe packages/desktop/release/MIFS-*-portable.exe packages/desktop/release/MIFS-Setup-*.exe.blockmap packages/desktop/release/latest.yml)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --title "MIFS $tag" --notes "Unsigned Windows installers: MIFS-Setup (installs for the current user) and MIFS-portable (single file)."
          fi
